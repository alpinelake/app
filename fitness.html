<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <link rel="icon" href="data:,">
  <script src="/app/db.js"></script>
  <title>Fitness</title>
  <style>
    :root {
      --accent: #c54b3e;
      --hstart: #46bc46;
      /*
      --hend: #ffd700;
      */
      --hend: white;
    }
    html, body { display: flex; margin: 0; padding: 0; width: 100%; height: 100%; overscroll-behavior: contain; }
    input, textarea, button, select { font-size: inherit; font-family: inherit; margin: 0; }
    button { user-select: none; }
    body {
      font-family: sans-serif;
      justify-content: center;
      background: lightgray;
    }
    #app {
      position: relative;
      display: flex;
      flex-direction: column;
      width: min(100%, 500px);
      box-sizing: border-box;
      background: white;
      color: black;
      overflow: hidden;
    }
    #container { overflow: scroll; }
    .record {
      display: flex;
      flex-direction: column;
      font-size: 16px;
    }
    /*
    .record:nth-child(2n+1) { background: #f9f9f9; }
    */
    .record .idetails { display: flex; justify-content: space-between; padding: 7px 15px 7px 13px; }
    .record .icontrols { display: flex; gap: 10px; padding: 5px 20px; margin-top: auto; }
    .record .icontrols button { background: var(--accent); border: none; color: orange; padding: 0px 8px; margin: 0; border-radius: 3px; }
    .record .icontrols input { accent-color: var(--accent); height: 18px; width: 18px; }
    .record:not(.selected):not(.blank) .field:placeholder-shown { display: none; }
    .record:not(.selected) .icontrols { display: none; }
    .record:not(.selected):not(.blank) .title { display: none; }
    .record:not(.selected):not(.blank) .desc { display: none; }
    .record:not(.selected) .field { pointer-events: none; }
    .record.blank .titleText { display: none; }
    .record.blank .descText { display: none; }
    .record.blank .lastGroup { display: none; }
    .record.inactive .lastGroup { display: none; }
    .record.selected { border: 1px solid; min-height: 120px; }
    .record.selected .icontrols { background: orange; color: white; }
    .record.selected .lastInput { display: none; }
    .record.selected .titleText { display: none; }
    .record.selected .descText { display: none; }
    .record:not(.selected).recent .lastGroup { display: none; }
    .record:not(.selected) .lastLabel { display: none; }
    /*
    .record:not(.selected):not(.inactive).today { background: #beffbe; color: green; }
    .record:not(.selected):not(.inactive).recent { background: #46bc46; color: white; }
    */
    .record:nth-last-child(1 of .pinned) { border-bottom: 3px solid black; }
    .record:not(.selected):not(.inactive).recent { background: #beffbe; color: green; }
    .record:not(.selected).inactive { opacity: .5; }
    .record.selected { background: #ffedd7 !important; }

    .record .col1 { display: flex; flex-direction: column; }
    .record .col2 { align-content: center; }
    .record .lastGroup { display: flex; gap: 5px; align-items: center; user-select: none; padding: 5px; text-align: right; line-height: 18px; }
    .record .lastInput { width: 25px; height: 25px; accent-color: #46bc46; min-width: 25px; min-height: 25px; }
    .record textarea { field-sizing: content; border: none; outline: none; appearance: none; resize: none; display: flex; align-content: center; background: none; color: inherit; padding: 0; }

    body.hideinactive .record.inactive { display: none; }

    #nav {
      display: flex;
      padding: 10px 15px;
      user-select: none;
      justify-content: space-between;
      align-items: center;
      font-size: 17px;
      height: 32px;
      background: #5C77D6;
      color: white;
    }

    /* Toggle */
    .switch { position: relative; width: 32px; height: 18px; align-self: center; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; }
    .slider:before { position: absolute; content: ""; height: 12px; width: 13px; left: 3px; bottom: 3px; background-color: white; }
    input:checked + .slider { background-color: #8599E0; }
    input:checked + .slider:before { transform: translateX(12px); }
    .slider.round { border-radius: 12px; }
    .slider.round:before { border-radius: 50%; }

    #hideInactive { display: flex; gap: 8px; align-items: center; }
    .activeStatus { display: flex; gap: 5px; align-items: center; }
    .pinnedStatus { display: flex; gap: 5px; align-items: center; }
    .statusGroup { display: flex; gap: 10px; }    
  </style>
</head>
<body>
  <div id="app">
    <div id="nav">
      <a id="addButton">Add Item</a>
      <div id="hideInactive">
        <label class="switch">
          <input type="checkbox" id="hideInactiveToggle">
          <span class="slider round"></span>
        </label>
        <div id="hideInactiveLabel">Hide Inactive</div>
      </div>
    </div>
    <div id="container"></div>
  </div>

  <script>
    function compose(func) {
      let lastKey = null;
      return function (...args) {
        const key = JSON.stringify(args);
        if (lastKey != key) {
          func(...args);
          lastKey = key;
        }
      };
    }

    const storeName = "fitnessDB";
    const settingsKey = "fitness:settings";
    const RecordState = { Inactive: 1, Active: 2 };
    const RecordPinned = { Pinned: 1 };
    let db = null;
    let records = null;
    const settings = loadSettings();

    function saveSettings() {
      localStorage.setItem(settingsKey, JSON.stringify(settings));
    }
    function loadSettings() {
      return JSON.parse(localStorage.getItem(settingsKey)) ||
        { hideInactive: false };
    }

    function render(addedId, force) {
      hideInactiveToggle.checked = settings.hideInactive;
      document.body.classList.toggle('hideinactive', settings.hideInactive);
      renderFlatUi(records || [], settings.hideInactive, force);
      if (addedId) {
        const record = container.querySelector(`.record[data-id="${addedId}"]`);
        const title = record.querySelector(`.title`);
        toggleRecord(record, true);
        title.focus();
      }
    }

    function toggleRecord(r, set) {
      container.querySelectorAll('.record').forEach((el) => {
        if (el == r) {
          if (set != undefined && set != null) {
            el.classList.toggle('selected', set);
          } else {
            el.classList.toggle('selected', !r.classList.contains('selected'));
          }
        } else {
          el.classList.toggle('selected', false);
        }
      });
      document.body.classList.toggle('selected', document.querySelector('.record.selected'));
    }

    function saveRecord(recordEl) {
      const id = parseInt(recordEl.dataset.id);
      if (!id) return;
      const updates = {};
      recordEl.querySelectorAll('.field').forEach((field) => {
        if (field.dataset.field) {
          const current = field.value.trim();
          const change = field.dataset.original.trim() !== current;
          if (change) {
            console.log(`${field.dataset.field} ${field.dataset.original} -> ${current}`);
            field.dataset.original = current;
            updates[field.dataset.field] = current;
          }
        }
      });
      if (Object.keys(updates).length) {
        updateRecord(db, id, updates).then(() => {
          loadRecords();
        });
      }
    }

    function buildRecordUi(data) {
      const root = document.createElement("div");
      root.classList.add('record');
      root.dataset.id = data.id;

      const pinned = data.pin == RecordPinned.Pinned;

      function onFieldKeydown(e) {
        switch (e.keyCode) {
          case 13: // Enter key saves record
            e.stopPropagation();
            e.preventDefault();
            const record = e.target.closest('.record');
            saveRecord(record);
            toggleRecord(record, false);
        }
      }

      const idetails = document.createElement("div");
      idetails.className = "idetails";
      const icontrols = document.createElement("div");
      icontrols.className = "icontrols";

      const col1 = document.createElement("div");
      const col2 = document.createElement("div");
      col1.className = "col1";
      col2.className = "col2";
      const title = document.createElement("textarea");
      title.className = "field title";
      title.dataset.field = "title";
      title.placeholder = "Title";
      title.addEventListener("keydown", onFieldKeydown);
      title.value = data.title || "";
      title.dataset.original = title.value;
      const desc = document.createElement("textarea");
      desc.className = "field desc";
      desc.dataset.field = "desc";
      desc.placeholder = "Description";
      desc.addEventListener("keydown", onFieldKeydown);
      desc.value = data.desc || "";
      desc.dataset.original = desc.value;
      desc.spellcheck = false;

      const titleText = document.createElement("div");
      titleText.className = "titleText";
      titleText.innerText = data.title || "";
      /*
      if (pinned) {
        titleText.innerText = "⭐ " + titleText.innerText;
      }
      */
      const descText = document.createElement("div");
      descText.className = "descText";
      descText.innerText = data.desc || "";

      const lastGroup = document.createElement("div");
      lastGroup.className = "lastGroup";
      const lastLabel = document.createElement("div");
      lastLabel.className = "lastLabel";
      let recent = false;
      let today = false;
      if (data.last) {
        const l = new Date(data.last);
        const dayStart = new Date();
        dayStart.setHours(0);
        if (l > dayStart) {
          today = true;
          const hours = Math.round((new Date() - l) / (1000 * 60 * 60));
          if (hours < 2) {
            recent = true;
          }
        }

        const lbase = new Date(l.getFullYear(), l.getMonth(), l.getDate(), 0, 0);
        const d = new Date();
        const dbase = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 0, 0);
        const days = Math.round((dbase - lbase) / (1000 * 60 * 60 * 24));
        root.dataset.days = days;
        if (!today) {
          lastLabel.innerText = `${days}d`;
        }

        if (!recent) {
          const percent = 100-Math.min(100, Math.round(days/7*100));
          if (percent <= 100) {
            root.style.setProperty(
              "background-image",
              `linear-gradient(90deg, var(--hstart) ${percent}%, ${percent}%, var(--hend))`
            );
          }
        }
      }

      const lastInput = document.createElement("input");
      lastInput.className = "lastInput";
      lastInput.type = "checkbox";
      lastInput.checked = recent;
      function checkDone() {
        lastInput.checked = true;
        lastLabel.innerText = "";
        const updates = {
          last: Date.now()
        };
        updateRecord(db, data.id, updates).then(() => {
          setTimeout(() => {
            loadRecords();
          }, 150);
        });
      }

      lastLabel.addEventListener("click", (e) => {
        e.stopPropagation();
        checkDone();
      });
      lastInput.addEventListener("change", (e) => {
        e.stopPropagation();
        checkDone();
      });
      lastInput.addEventListener("click", (e) => {
        e.stopPropagation();
      });
      lastGroup.append(lastLabel, lastInput);

      const delGroup = document.createElement("div");
      delGroup.className = "delGroup";
      const delButton = document.createElement("button");
      delButton.className = "delButton";
      delButton.innerText = "Delete";
      delButton.addEventListener("click", (e) => {
        e.stopPropagation();
        let approved = confirm(`Delete item?`);
        if (approved) {
          deleteRecord(db, data.id).then(() => {
            toggleRecord(null, false);
            loadRecords();
          });
        }
      });
      delGroup.append(delButton);


      const active = !data.state || data.state == RecordState.Active;
      const activeStatus = document.createElement("div");
      activeStatus.className = "activeStatus";
      const activeInput = document.createElement("input");
      activeInput.className = "active";
      activeInput.checked = active;
      activeInput.type = "checkbox";
      const activeLabel = document.createElement("label");
      activeLabel.innerText = "Active";
      activeStatus.append(activeInput, activeLabel);
      activeInput.addEventListener("change", (e) => {
        const updates = {
          state: activeInput.checked ? data.state == RecordState.Active : RecordState.Inactive
        };
        updateRecord(db, data.id, updates).then(() => {
          loadRecords();
        });
      });

      const pinnedStatus = document.createElement("div");
      pinnedStatus.className = "pinnedStatus";
      const pinnedInput = document.createElement("input");
      pinnedInput.className = "pinned";
      pinnedInput.checked = pinned;
      pinnedInput.type = "checkbox";
      const pinnedLabel = document.createElement("label");
      pinnedLabel.innerText = "Pinned";
      pinnedStatus.append(pinnedInput, pinnedLabel);
      pinnedInput.addEventListener("change", (e) => {
        const updates = {
          pin: pinnedInput.checked ? RecordPinned.Pinned : null
        };
        updateRecord(db, data.id, updates).then(() => {
          loadRecords();
        });
      });

      const statusGroup = document.createElement("div");
      statusGroup.className = "statusGroup";
      statusGroup.append(activeStatus, pinnedStatus);

      col1.append(titleText, title, descText, desc);
      col2.append(lastGroup);
      idetails.append(col1, col2);
      icontrols.append(statusGroup, delGroup);
      root.append(idetails, icontrols);
      root.classList.toggle('inactive', !active);
      root.classList.toggle('pinned', pinned);
      root.classList.toggle('recent', recent);
      root.classList.toggle('today', today);
      root.classList.toggle('blank', !data.title);
      return root;
    }

    const renderFlatUi = compose((data, hideInactive, force) => {
      if (force) console.log(`force render ${force}`);
      container.replaceChildren();

      const sorted = data.sort((a,b) => {
        if (a.pin == b.pin) {
          return a.last - b.last;
        } else if (a.pin) {
          return -1;
        } else if (b.pin) {
          return 1;
        } else {
          return a.last - b.last;
        }
      });

      const filtered = hideInactive ? 
        sorted.filter((a) => a.state == RecordState.Active || !a.state) :
        sorted;

      filtered.forEach((record, index) => {
        const el = buildRecordUi(record);
        container.append(el);
      });

    });

    async function loadRecords(addedId) {
      db = await openDatabase(storeName);
      getAll(db).then((result) => {
        records = result;
        render(addedId);
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      loadRecords();
    });

    hideInactiveToggle.addEventListener("change", (e) => {
      settings.hideInactive = hideInactiveToggle.checked;
      saveSettings();
      render();
    });
    hideInactiveLabel.addEventListener("click", (e) => {
      e.stopPropagation();
      settings.hideInactive = !hideInactiveToggle.checked;
      saveSettings();
      render();
    });

    addButton.addEventListener("click", (e) => {
      addRecord(db, {
        createdAt: Date.now()
      }).then((id) => {
        loadRecords(id);
      });
    });

    document.body.addEventListener("click", (e) => {
      const clicked = e.target.closest('.record');
      const infield = e.target.closest('.field');
      const controls = e.target.closest('.lastGroup');
      const previous = document.querySelector('.record.selected');
      if (previous) {
        if (previous != clicked || !infield) {
          saveRecord(previous);
          toggleRecord(clicked);
        }
      } else if (!controls) {
        if (clicked) {
          toggleRecord(clicked);
        } else {
          toggleRecord(null, false);
        }
      }
    });

    let lastHidden = null;

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState == 'hidden') {
        lastHidden = new Date();
      } else if (document.visibilityState == 'visible') {
        let diff = Math.abs(new Date() - lastHidden);
        let minutes = Math.floor(diff / (1000 * 60));
        if (minutes > 10) {
          console.log(`page visibility hidden ${minutes} min ago; rerender page`);
          render(null, lastHidden);
        }
      }
    });

  </script>

</body>
</html>
