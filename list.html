<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <link rel="icon" href="data:,">
  <script src="/app/db.js"></script>
  <title>List</title>
  <style>
    :root {
      --background: hsl(224, 20%, 10%);
      --background-light: hsl(224, 20%, 20%);
      --highlight: #85ace7;
      --light: #f9f9f9;
    }
    html, body { display: flex; margin: 0; padding: 0; width: 100%; height: 100%; }
    input, button, select { font-size: inherit; font-family: inherit; margin: 0; }
    button { user-select: none; margin: 0; padding: 0; }
    textarea { font-family: inherit; font-size: inherit; resize: none; field-sizing: content; }
    body {
      font-family: sans-serif;
      font-size: 1.2em;
      justify-content: center;
      background: black;
    }
    #app {
      position: relative;
      text-align: center;
      display: flex;
      flex-direction: column;
      width: min(100%, 500px);
      box-sizing: border-box;
      background: var(--background);
      color: var(--light);
    }
    #header {
      display: flex;
      justify-content: space-between;
      gap: 5px;
      padding: 0 20px;
      background: var(--background-light);
      color: var(--light);
    }
    #header .listField {
      display: flex;
      gap: 10px;
    }
    #header .listActions {
      font-size: .9em;
      align-self: center;
    }
    #listSelect {
      field-sizing: content;
      padding: 20px 0;
      appearance: none;
      border: none;
      background: none;
      color: inherit;
      min-width: 50px;
    }

    #deleteListButton {
      font-size: 1.2em;
    }
    #clearButton,
    #deleteListButton {
      background: none;
      border: none;
      color: var(--highlight);
    }
    #deleteListButton:disabled {
      visibility: hidden;
    }
    #clearButton {
      font-variant: all-petite-caps;
    }
    #clearButton:disabled {
      opacity: .5;
    }
    
    body:not(.loaded) #listEntries { display: none; }

    #listEntries {
      display: flex;
      flex-direction: column;
      overflow: scroll;
      padding: 10px 15px;
      scrollbar-width: none;
      font-size: .9em;
    }
    .entry { display: flex; align-items: center; gap: 5px; }
    .entry.checked textarea { opacity: .5; }
    .entry.placeholder textarea { border-bottom: 1px dashed var(--background-light); }
    .entry input[type="checkbox"] {
      width: 14px;
      height: 14px;
      appearance: none;
      outline: 1px solid var(--light);
      background: none;
    }
    .entry input[type="checkbox"]:checked {
      outline: 1px solid black;
      background: var(--background-light);
    }
    .entry input[type="checkbox"]:disabled {
      opacity: .3;
    }
    .entry textarea {
      border: none;
      outline: none;
      margin: 5px;
      overflow: hidden;
      background: none;
      color: inherit;
      min-width: 40px;
    }
    .entry button.delete {
      background: none;
      border: none;
      color: var(--highlight);
      margin: 0 5px;
      font-size: 1.2rem;
      visibility: hidden;
    }
    #listEntries:not(.focused) button.delete {
      visibility: hidden;
    }

  </style>
</head>
<body>
  <div id="app">
    <div id="header">
      <div class="listField">
        <select id="listSelect"></select>
        <button id="deleteListButton">✗</button>
      </div>
      <div class="listActions">
        <button id="clearButton">Clear</button>
      </div>
    </div>
    <div id="listEntries"></div>
  </div>

  <script>
    function compose(func) {
      let lastKey = null;
      return function (...args) {
        const key = JSON.stringify(args);
        if (lastKey != key) {
          func(...args);
          lastKey = key;
        }
      };
    }

    const storeName = "listDB";
    const urlKey = "id";
    let db = null;
    let lists = null;
    let autoFocusIndex = null;

    function render(id) {
      renderListOptions(lists, id || listSelect.value);
      const list = lists.find((l) => l.id == listSelect.value);
      document.body.classList.toggle('loaded', !!list);
      renderList(list);
      deleteListButton.disabled = !list;
      if (autoFocusIndex != null) {
        listEntries.querySelector(`[data-idx="${autoFocusIndex}"] textarea`).focus();
        autoFocusIndex = null;
      }

      //if (listSelect.value) {
      //  const url = new URL(window.location);
      //  url.searchParams.set(urlKey, listSelect.value);
      //  history.replaceState(null, '', url);
      //}
    }

    const ItemStatus = {
      Checked: 1
    };

    onTextKeydown = function(e, list, idx) {
      const repeats = 2;
      const entries = list.entries;
      let start;
      switch (e.keyCode) {
        case 13: // Enter key inserts a line
          e.stopPropagation();
          e.preventDefault();
          start = e.target.selectionStart;
          if (start != null) {
            const text0 = e.target.value.substring(0, start);
            const text1 = e.target.value.substring(start);
            entries[idx].text = text0.trim();
            entries.splice(idx+1, 0, { text: text1.trim() });
            updateRecord(db, list.id, { entries });
            autoFocusIndex = idx+1;
            render();
          }
          break;
        case 8:  // Backspace key deletes a line
          start = e.target.selectionStart;
          if (start === 0 && idx >= 1) {
            if (start == 0) {
              let bspace = parseInt(e.target.dataset.bspace ?? repeats);
              if (bspace <= 0) {
                // merge text if possible
                if (idx > 1 && e.target.value.trim()) {
                  entries[idx-1].text = entries[idx-1].text.trim() + ' ' + e.target.value.trim();
                }
                entries.splice(idx, 1);
                render();
              } else {
                bspace -= 1;
                e.target.dataset.bspace = bspace;
              }
              setTimeout(() => {
                e.target.dataset.bspace = repeats;
              }, 2000);
            }
          }
          break;
      }
    };

    const renderList = compose((list) => {
      listEntries.replaceChildren();
      const entries = list?.entries || [];
      let checkedCount = 0;

      entries.forEach((entry, index) => {
        const el = document.createElement("div");
        el.className = "entry";
        el.dataset.idx = index;
        const check = document.createElement("input");
        check.type = "checkbox";
        check.checked = entry.status == ItemStatus.Checked;
        check.addEventListener("change", (event) => {
          entry.status = check.checked ? ItemStatus.Checked : null;
          updateRecord(db, listSelect.value, list).then(() => {
            render();
          });
        });
        if (entry.status == ItemStatus.Checked) {
          checkedCount += 1;
        }
        const text = document.createElement("textarea");
        text.value = entry.text;
        if (entries.length == 1 && !text.value) {
          text.placeholder = "Starting item...";
        }
        el.dataset.original = entry.text;
        text.spellcheck = false;
        text.addEventListener('keydown', (e) => {
          onTextKeydown(e, list, index);
        });
        text.addEventListener('focus', (e) => {
          listEntries.classList.add('focused');
        });
        text.addEventListener('blur', (e) => {
          listEntries.classList.remove('focused');
          const current = text.value;
          const diff = el.dataset.original !== current;
          if (diff) {
            el.dataset.original = current;
            entry.text = current;
            updateRecord(db, list.id, { entries });
          }
        });
        el.append(check, text);
        listEntries.append(el);
        el.classList.toggle('checked', entry.status == ItemStatus.Checked);
      });

      clearButton.disabled = checkedCount == 0;
    });

    listSelect.addEventListener('change', (e) => {
      e.preventDefault();
      e.stopPropagation();
      if (listSelect.value == "create") {
        let name = prompt(`Name`).trim();
        if (name) {
          createList(name);
        } else {
          listSelect.value = "";
        }
      } else {
        render();
      }
    });

    const renderListOptions = compose((lists, selectId) => {
      listSelect.replaceChildren();

      const hint = document.createElement("option");
      hint.value = ""; 
      hint.disabled = true;
      hint.hidden = true;
      hint.innerText = "Select list...";
      listSelect.append(hint);

      const placeholder = document.createElement("option");
      placeholder.value = "create"; 
      placeholder.innerText = "Add list...";
      listSelect.append(placeholder);

      let foundId = null;
      lists.forEach((list, index) => {
        const el = document.createElement("option");
        el.value = list.id;
        el.innerText = list.name;
        if (list.id == selectId) {
          foundId = list.id;
        }
        listSelect.append(el);
      });

      if (lists.length == 0) {
        listSelect.value = "";
      } else {
        listSelect.value = foundId || lists[0]?.id;
      }
    });

    deleteListButton.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      const list = lists.find((l) => l.id == listSelect.value);
      let confirmation = confirm(`Delete list?`);
      if (confirmation) {
        deleteRecord(db, list.id);
        loadLists(null);
      }
    });

    clearButton.addEventListener('click', (e) => {
      const list = lists.find((l) => l.id == listSelect.value);
      const unchecked = list.entries.filter((entry) => entry.status != ItemStatus.Checked);
      if (confirm(`Clear checked items?`)) {
        if (unchecked.length > 0) {
          list.entries = unchecked;
        } else {
          list.entries = blankList();
        }
        updateRecord(db, list.id, list).then(() => {
          render();
        });
      }
    });

    function blankList() {
      return [{text:''}];
    }

    async function loadLists(id) {
      db = await openDatabase(storeName);
      getAll(db).then((result) => {
        lists = result;
        render(id);
      });
    }

    async function createList(name) {
      addRecord(db, {
        name,
        entries: blankList(),
        createdAt: Date.now()
      }).then((id) => {
        loadLists(id);
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      //const searchParams = new URLSearchParams(window.location.search);
      //const id = searchParams.get(urlKey);
      //loadLists(id);
      loadLists();
    });

  </script>

</body>
</html>
