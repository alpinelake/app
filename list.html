<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <link rel="icon" href="data:,">
  <script src="/app/db.js"></script>
  <title>List</title>
  <style>
    :root {
      --app: hsl(224, 20%, 10%);
      --header: hsl(224, 20%, 20%);
      --highlight: #85ace7;
      --light: #f9f9f9;
    }
    html, body { display: flex; margin: 0; padding: 0; width: 100%; height: 100%; }
    input, button, select { font-size: inherit; font-family: inherit; margin: 0; }
    button { user-select: none; margin: 0; padding: 0; }
    textarea { font-family: inherit; font-size: inherit; resize: none; field-sizing: content; }
    body {
      font-family: sans-serif;
      font-size: 1.2em;
      justify-content: center;
      background: black;
    }
    #app {
      position: relative;
      text-align: center;
      display: flex;
      flex-direction: column;
      width: min(100%, 500px);
      box-sizing: border-box;
      background: var(--app);
      color: var(--light);
    }
    #header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 5px;
      padding: 0 25px;
      background: var(--header);
      color: var(--light);
    }
    #header .listField {
      display: flex;
      gap: 10px;
      user-select: none;
    }
    #topnavIcon { font-size: 34px; display: flex; user-select: none; }
    #topnav { display: flex; flex-direction: column; background: var(--header); font-size: .9em; font-family: Arial; }
    #topnav > div { display: flex; padding: 8px 25px; justify-content: end; user-select: none; }
    #topnav > div.disabled { opacity: .5; pointer-events: none; }
    body:not(.nav) #topnav { display: none; }
    #hideChecked { gap: 10px; align-items: center; }

    #listSelect {
      field-sizing: content;
      padding: 20px 0;
      appearance: none;
      border: none;
      background: none;
      color: inherit;
      min-width: 50px;
    }
    #listSelect:disabled { opacity: .5; }

    #listEntries {
      display: none;
      flex-direction: column;
      overflow: scroll;
      padding: 10px 18px;
      scrollbar-width: none;
      font-size: .9em;
      gap: 5px;
    }
    #listStatus {
      display: none;
      gap: 10px;
      font-size: 16px;
      padding: 10px 18px;
      user-select: none;
    }
    #allHiddenText {
      color: #6b6877;
    }
    #allHiddenReveal {
      color: var(--highlight);
      text-decoration: underline;
    }
    body.loaded #listEntries { display: flex; }
    body.loaded.checked #listStatus { display: flex; }

    .entry { display: flex; align-items: center; gap: 10px; }
    body.autohide .entry.checked { display: none; }
    .entry.checked textarea { opacity: .5; }
    .entry.placeholder textarea { border-bottom: 1px dashed var(--header); }
    .entry input[type="checkbox"] {
      width: 16px;
      height: 16px;
      appearance: none;
      outline: 1px solid var(--light);
      background: none;
    }
    .entry input[type="checkbox"]:checked {
      outline: 1px solid black;
      background: var(--header);
    }
    .entry input[type="checkbox"]:disabled {
      opacity: .3;
    }
    .entry textarea {
      border: none;
      outline: none;
      overflow: hidden;
      background: none;
      color: inherit;
      min-width: 40px;
    }
    .entry button.delete {
      background: none;
      border: none;
      color: var(--highlight);
      margin: 0 5px;
      font-size: 1.2rem;
      visibility: hidden;
    }


    /* Toggle styles */

    .switch { position: relative; width: 38px; height: 23px; align-self: center; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; }
    .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 4px; bottom: 4px; background-color: white; }
    input:checked + .slider { background-color: #2196F3; }
    input:focus + .slider { box-shadow: 0 0 1px #2196F3; }
    input:checked + .slider:before { transform: translateX(14px); }
    .slider.round { border-radius: 12px; }
    .slider.round:before { border-radius: 50%; }
  </style>
</head>
<body>
  <div id="app">
    <div id="header">
      <div class="listField">
        <select id="listSelect"></select>
      </div>
      <div id="topnavIcon">≡</div>
    </div>
    <div id="topnav">
      <div id="hideChecked">
        <div>Hide Checked</div>
        <label class="switch">
          <input type="checkbox" id="hideCheckedToggle">
          <span class="slider round"></span>
        </label>
      </div>
      <div id="addListButton">Add List...</div>
      <div id="deleteListButton">Delete List...</div>
      <div id="clearListButton">Clear Checked Items...</div>
    </div>
    <div id="listEntries"></div>
    <div id="listStatus">
      <div id="allHiddenText"></div>
      <a id="allHiddenReveal"></a>
    </div>
  </div>

  <script>
    function compose(func) {
      let lastKey = null;
      return function (...args) {
        const key = JSON.stringify(args);
        if (lastKey != key) {
          func(...args);
          lastKey = key;
        }
      };
    }

    const storeName = "listDB";
    const urlKey = "id";
    let db = null;
    let lists = null;
    let autoFocusIndex = null;
    let autoHideChecked = hideCheckedToggle.checked;

    function render(id) {
      hideCheckedToggle.checked = autoHideChecked;
      renderListOptions(lists, id || listSelect.value);
      listSelect.disabled = lists.length == 0;
      const list = lists.find((l) => l.id == listSelect.value);
      const checked = list?.entries.filter((entry) => entry.status == ItemStatus.Checked);
      document.body.classList.toggle('loaded', !!list);
      document.body.classList.toggle('autohide', autoHideChecked);
      document.body.classList.toggle('checked', !!checked?.length);
      allHiddenReveal.innerText = autoHideChecked ? 'Show' : 'Hide';
      if (list && checked) {
        allHiddenText.innerText = `${checked.length} checked ${checked.length == 1 ? 'entry' : 'entries'}`;
      }
      renderList(list);
      hideChecked.classList.toggle('disabled', !list || list.entries.length == 0);
      clearListButton.classList.toggle('disabled', !list || checked?.length == 0);
      deleteListButton.classList.toggle('disabled', !list);
      if (autoFocusIndex != null) {
        listEntries.querySelector(`[data-idx="${autoFocusIndex}"] textarea`).focus();
        autoFocusIndex = null;
      }
    }

    const ItemStatus = {
      Checked: 1
    };

    onTextKeydown = function(e, list, idx) {
      const repeats = 2;
      const entries = list.entries;
      let start;
      switch (e.keyCode) {
        case 13: // Enter key splits/inserts a line
          e.stopPropagation();
          e.preventDefault();
          start = e.target.selectionStart;
          if (start != null) {
            const text0 = e.target.value.substring(0, start);
            const text1 = e.target.value.substring(start);
            entries[idx].text = text0.trim();
            entries.splice(idx+1, 0, { text: text1.trim() });
            if (start == 0) {
              entries[idx+1].status = entries[idx].status;
              delete entries[idx].status;
            }
            updateRecord(db, list.id, { entries });
            autoFocusIndex = idx+1;
            render();
          }
          break;
        case 8:  // Backspace key merges/deletes a line
          start = e.target.selectionStart;
          if (start === 0 && idx >= 1) {
            if (start == 0) {
              let bspace = parseInt(e.target.dataset.bspace ?? repeats);
              if (bspace <= 0) {
                // merge text if possible
                if (idx > 1 && e.target.value.trim()) {
                  entries[idx-1].text = entries[idx-1].text.trim() + ' ' + e.target.value.trim();
                }
                entries.splice(idx, 1);
                render();
              } else {
                bspace -= 1;
                e.target.dataset.bspace = bspace;
              }
              setTimeout(() => {
                e.target.dataset.bspace = repeats;
              }, 2000);
            }
          }
          break;
      }
    };

    const renderList = compose((list) => {
      listEntries.replaceChildren();
      const entries = list?.entries || [];
      entries.forEach((entry, index) => {
        const el = document.createElement("div");
        el.className = "entry";
        el.dataset.idx = index;
        el.classList.toggle('checked', entry.status == ItemStatus.Checked);
        const check = document.createElement("input");
        check.type = "checkbox";
        check.checked = entry.status == ItemStatus.Checked;
        check.addEventListener("change", (event) => {
          entry.status = check.checked ? ItemStatus.Checked : null;
          updateRecord(db, listSelect.value, list).then(() => {
            render();
          });
        });
        const text = document.createElement("textarea");
        text.value = entry.text;
        if (entries.length == 1 && !text.value) {
          text.placeholder = "Text...";
        }
        el.dataset.original = entry.text;
        text.spellcheck = false;
        text.addEventListener('keydown', (e) => {
          onTextKeydown(e, list, index);
        });
        text.addEventListener('focus', (e) => {
          listEntries.classList.add('focused');
        });
        text.addEventListener('blur', (e) => {
          listEntries.classList.remove('focused');
          const current = text.value;
          const diff = el.dataset.original !== current;
          if (diff) {
            el.dataset.original = current;
            entry.text = current;
            updateRecord(db, list.id, { entries });
          }
        });
        el.append(check, text);
        listEntries.append(el);
      });
    });

    hideCheckedToggle.addEventListener('change', (e) => {
      autoHideChecked = hideCheckedToggle.checked;
      render();
    });

    listSelect.addEventListener('change', (e) => {
      e.preventDefault();
      e.stopPropagation();
      render();
    });

    const renderListOptions = compose((lists, selectId) => {
      listSelect.replaceChildren();

      const hint = document.createElement("option");
      hint.value = ""; 
      hint.disabled = true;
      hint.hidden = true;
      hint.innerText = "Select list...";
      listSelect.append(hint);

      let foundId = null;
      lists.forEach((list, index) => {
        const el = document.createElement("option");
        el.value = list.id;
        el.innerText = list.name;
        if (list.id == selectId) {
          foundId = list.id;
        }
        listSelect.append(el);
      });

      if (lists.length == 0) {
        listSelect.value = "";
      } else {
        listSelect.value = foundId || lists[0]?.id;
      }
    });

    addListButton.addEventListener('click', (e) => {
      let name = prompt(`Name`)?.trim();
      if (name) {
        document.body.classList.toggle('nav', false);
        createList(name);
      }
    });

    deleteListButton.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      const list = lists.find((l) => l.id == listSelect.value);
      let confirmation = confirm(`Delete list?`);
      if (confirmation) {
        document.body.classList.toggle('nav', false);
        deleteRecord(db, list.id);
        loadLists(null);
      }
    });

    topnavIcon.addEventListener('click', (e) => {
      document.body.classList.toggle('nav');
    });

    clearListButton.addEventListener('click', (e) => {
      const list = lists.find((l) => l.id == listSelect.value);
      const unchecked = list.entries.filter((entry) => entry.status != ItemStatus.Checked);
      if (confirm(`Clear checked items?`)) {
        document.body.classList.toggle('nav', false);
        if (unchecked.length > 0) {
          list.entries = unchecked;
        } else {
          list.entries = blankList();
        }
        updateRecord(db, list.id, list).then(() => {
          render();
        });
      }
    });

    allHiddenReveal.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      autoHideChecked = !autoHideChecked;
      render();
    });

    function blankList() {
      return [{text:''}];
    }

    async function loadLists(id) {
      db = await openDatabase(storeName);
      getAll(db).then((result) => {
        lists = result;
        render(id);
      });
    }

    async function createList(name) {
      addRecord(db, {
        name,
        entries: blankList(),
        createdAt: Date.now()
      }).then((id) => {
        loadLists(id);
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      loadLists();
    });

  </script>

</body>
</html>
